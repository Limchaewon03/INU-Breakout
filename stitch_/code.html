<script data-purpose="breakout-game-engine">
    // Game Configuration & References
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const livesDisplay = document.getElementById('lives-display');
    const timerDisplay = document.getElementById('timer-display');
    const brickCountDisplay = document.getElementById('brick-count-display');
    const btnPause = document.getElementById('btn-pause');
    const btnRestart = document.getElementById('btn-restart');
    const pauseIcon = document.getElementById('pause-icon');
    const pauseText = document.getElementById('pause-text');

    const overlay = document.getElementById('game-overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const overlayStartBtn = document.getElementById('overlay-start-btn');

    // 6-Color Palette Required: Light Red, Light Orange, Light Yellow, Light Blue, Light Green, Light Purple
    const PASTEL_PALETTE = [
      { fill: '#ffcdd2', border: '#ef9a9a', text: '#b71c1c' }, // 연한 빨강
      { fill: '#ffe0b2', border: '#ffcc80', text: '#e65100' }, // 연한 주황
      { fill: '#fff9c4', border: '#fff59d', text: '#f57f17' }, // 연한 노랑
      { fill: '#c8e6c9', border: '#a5d6a7', text: '#1b5e20' }, // 연한 녹색
      { fill: '#bbdefb', border: '#90caf9', text: '#0d47a1' }, // 연한 파랑
      { fill: '#e1bee7', border: '#ce93d8', text: '#4a148c' }  // 연한 보라
    ];

    // Core Game States
    let isRunning = false;
    let isPaused = false;
    let lives = 3;
    let remainingBricks = 40;
    let secondsElapsed = 0;
    let timerInterval = null;
    let animationFrameId = null;

    // Paddle Setup
    const paddle = {
      width: 140,
      height: 18,
      x: (canvas.width - 140) / 2,
      y: canvas.height - 70,
      speed: 8,
      dx: 0,
      color: '#004098'
    };

    // Ball Setup (Blue Energy Core / Torch Flame vibe)
    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 100,
      radius: 13,
      speed: 6.0,
      dx: 3.5,
      dy: -5.0,
      trail: []
    };

    // Bricks Grid Specifications: 5 rows × 8 cols = 40 bricks
    const brickConfig = {
      rowCount: 5,
      colCount: 8,
      width: 74,
      height: 28,
      padding: 6,
      offsetTop: 70,
      offsetLeft: 44
    };

    let bricks = [];

    // Helper: Initialize Bricks with Pastel Colors
    function initBricks() {
      bricks = [];
      remainingBricks = brickConfig.rowCount * brickConfig.colCount;
      brickCountDisplay.innerText = remainingBricks;

      for (let r = 0; r < brickConfig.rowCount; r++) {
        bricks[r] = [];
        for (let c = 0; c < brickConfig.colCount; c++) {
          // Harmonious pastel color distribution
          const colorObj = PASTEL_PALETTE[(r * brickConfig.colCount + c) % PASTEL_PALETTE.length];
          bricks[r][c] = {
            x: 0,
            y: 0,
            status: 1, // 1 = alive, 0 = broken
            color: colorObj.fill,
            borderColor: colorObj.border,
            textColor: colorObj.text
          };
        }
      }
    }

    // Reset Ball and Paddle Position
    function resetBallAndPaddle() {
      paddle.x = (canvas.width - paddle.width) / 2;
      ball.x = canvas.width / 2;
      ball.y = paddle.y - ball.radius - 2;
      // Randomize initial direction slightly upward
      const angle = (Math.random() * 0.6 - 0.3) * Math.PI; // -54 to +54 deg
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -Math.abs(ball.speed * Math.cos(angle));
      ball.trail = [];
    }

    // Render Lives Display
    function updateLivesDisplay() {
      let heartStr = '';
      for (let i = 0; i < 3; i++) {
        heartStr += (i < lives) ? '❤️ ' : '🤍 ';
      }
      livesDisplay.innerHTML = heartStr.trim();
    }

    // Format & Render Timer
    function updateTimerDisplay() {
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      timerDisplay.innerText = `${mins}:${secs}`;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (isRunning && !isPaused) {
          secondsElapsed++;
          updateTimerDisplay();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    // Drawing Functions
    function drawPaddle() {
      ctx.save();
      
      // Paddle Drop Shadow
      ctx.shadowColor = 'rgba(0, 64, 152, 0.35)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 4;

      // Rounded Paddle Body
      const radius = paddle.height / 2;
      const x = paddle.x;
      const y = paddle.y;
      const w = paddle.width;
      const h = paddle.height;

      const grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, '#2b72db');
      grad.addColorStop(0.5, '#004098');
      grad.addColorStop(1, '#002868');

      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Top Highlight Rim
      ctx.shadowColor = 'transparent';
      ctx.beginPath();
      ctx.moveTo(x + radius, y + 2);
      ctx.lineTo(x + w - radius, y + 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // INU Accent Center Line
      ctx.fillStyle = '#f7941d';
      ctx.beginPath();
      ctx.roundRect(x + w/2 - 12, y + h/2 - 2, 24, 4, 2);
      ctx.fill();

      ctx.restore();
    }

    function drawBall() {
      ctx.save();

      // Ball particle trail
      for (let i = 0; i < ball.trail.length; i++) {
        const t = ball.trail[i];
        const alpha = (i + 1) / ball.trail.length * 0.25;
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.radius * (0.5 + (i / ball.trail.length) * 0.4), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 80, 200, ${alpha})`;
        ctx.fill();
      }

      // Ball Outer Glow
      ctx.shadowColor = '#0055ff';
      ctx.shadowBlur = 14;

      // Ball Body (Torch Blue Energy Sphere)
      const grad = ctx.createRadialGradient(
        ball.x - ball.radius * 0.3,
        ball.y - ball.radius * 0.3,
        ball.radius * 0.1,
        ball.x,
        ball.y,
        ball.radius
      );
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, '#5ca2ff');
      grad.addColorStop(0.85, '#0048ba');
      grad.addColorStop(1, '#002570');

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Sharp Highlight
      ctx.shadowColor = 'transparent';
      ctx.beginPath();
      ctx.arc(ball.x - ball.radius * 0.35, ball.y - ball.radius * 0.35, ball.radius * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.fill();

      ctx.restore();
    }

    function drawBricks() {
      for (let r = 0; r < brickConfig.rowCount; r++) {
        for (let c = 0; c < brickConfig.colCount; c++) {
          const b = bricks[r][c];
          if (b.status === 1) {
            const brickX = c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft;
            const brickY = r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop;
            b.x = brickX;
            b.y = brickY;

            ctx.save();

            // Brick Shadow & Body
            ctx.shadowColor = 'rgba(0,0,0,0.06)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetY = 2;

            // Rounded rectangle for brick
            ctx.beginPath();
            ctx.roundRect(brickX, brickY, brickConfig.width, brickConfig.height, 6);
            ctx.fillStyle = b.color;
            ctx.fill();

            // Border Stroke
            ctx.shadowColor = 'transparent';
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = b.borderColor;
            ctx.stroke();

            // 3D Inner Bevel Highlight
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1;
            ctx.strokeRect(brickX + 1.5, brickY + 1.5, brickConfig.width - 3, 1);

            // Brick Text: '벽돌' (As requested in wireframe https://lh3.googleusercontent.com/aida-public/AB6AXuDUKs06CsrwPUBaT2V6vRv6ZR6UCXnQneuuS4WR8MUFsd81IKZIQBbvd1ZZF7C18AGFkX5PT2gD42cc_Qft_u7B3aa1Ygfp55Yjiwr635RPabMJZ0KwmQH6P6xqlM8fG52KlssrckvH3QnaXcipGWAi25Ip5tpWejfWwHm08FhfuCWkZKKb8vE48GBBDamjwDr3mdL8q_2OBoWFP1UFy8pj4Np_pGN7MTGaVADzrEzmTmjWawZOBK2v-JukDK_ZpqD0pR0)
            ctx.font = 'bold 12px Pretendard, sans-serif';
            ctx.fillStyle = b.textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('벽돌', brickX + (brickConfig.width / 2), brickY + (brickConfig.height / 2) + 1);

            ctx.restore();
          }
        }
      }
    }

    // Collision Detection Logic
    function detectCollisions() {
      for (let r = 0; r < brickConfig.rowCount; r++) {
        for (let c = 0; c < brickConfig.colCount; c++) {
          const b = bricks[r][c];
          if (b.status === 1) {
            // Check collision between ball circle & brick box
            const nearestX = Math.max(b.x, Math.min(ball.x, b.x + brickConfig.width));
            const nearestY = Math.max(b.y, Math.min(ball.y, b.y + brickConfig.height));
            const distX = ball.x - nearestX;
            const distY = ball.y - nearestY;

            if ((distX * distX + distY * distY) < (ball.radius * ball.radius)) {
              // Collision occurred!
              b.status = 0;
              remainingBricks--;
              brickCountDisplay.innerText = remainingBricks;

              // Collision angle calculation for realistic bounce
              const overlapLeft = Math.abs((ball.x + ball.radius) - b.x);
              const overlapRight = Math.abs((ball.x - ball.radius) - (b.x + brickConfig.width));
              const overlapTop = Math.abs((ball.y + ball.radius) - b.y);
              const overlapBottom = Math.abs((ball.y - ball.radius) - (b.y + brickConfig.height));

              const minOverlapX = Math.min(overlapLeft, overlapRight);
              const minOverlapY = Math.min(overlapTop, overlapBottom);

              if (minOverlapX < minOverlapY) {
                ball.dx = -ball.dx;
              } else {
                ball.dy = -ball.dy;
              }

              // Check victory condition
              if (remainingBricks === 0) {
                handleGameOver(true);
              }
              return;
            }
          }
        }
      }
    }

    // Core Animation Frame Loop
    function updateGame() {
      if (!isRunning || isPaused) return;

      // 1. Move Paddle
      paddle.x += paddle.dx;
      if (paddle.x < 10) paddle.x = 10;
      if (paddle.x + paddle.width > canvas.width - 10) {
        paddle.x = canvas.width - paddle.width - 10;
      }

      // 2. Manage Ball Trail
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 5) {
        ball.trail.shift();
      }

      // 3. Move Ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall Bounce (Left & Right)
      if (ball.x - ball.radius <= 10) {
        ball.x = 10 + ball.radius;
        ball.dx = -ball.dx;
      } else if (ball.x + ball.radius >= canvas.width - 10) {
        ball.x = canvas.width - 10 - ball.radius;
        ball.dx = -ball.dx;
      }

      // Ceiling Bounce
      if (ball.y - ball.radius <= 10) {
        ball.y = 10 + ball.radius;
        ball.dy = -ball.dy;
      }

      // Paddle Collision
      if (
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width
      ) {
        // Dynamic angle calculation based on hit location
        const hitOffset = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        const maxAngle = Math.PI * 0.42; // max ~75 degrees
        const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
        const bounceAngle = hitOffset * maxAngle;

        ball.dx = currentSpeed * Math.sin(bounceAngle);
        ball.dy = -Math.abs(currentSpeed * Math.cos(bounceAngle));
        ball.y = paddle.y - ball.radius - 1;
      }

      // Fall Below Bottom Edge (Life Lost)
      if (ball.y - ball.radius > canvas.height) {
        lives--;
        updateLivesDisplay();

        if (lives <= 0) {
          handleGameOver(false);
          return;
        } else {
          // Reset ball position for next life
          resetBallAndPaddle();
        }
      }

      // 4. Brick Collision
      detectCollisions();

      // 5. Redraw Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawPaddle();
      drawBall();

      animationFrameId = requestAnimationFrame(updateGame);
    }

    // Modal & State Handlers
    function showOverlay(title, subtitle, btnText) {
      overlayTitle.innerText = title;
      overlaySubtitle.innerText = subtitle;
      overlayStartBtn.innerText = btnText;
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function startGame() {
      lives = 3;
      secondsElapsed = 0;
      updateLivesDisplay();
      updateTimerDisplay();
      initBricks();
      resetBallAndPaddle();
      hideOverlay();
      isRunning = true;
      isPaused = false;
      pauseIcon.innerText = '⏸️';
      pauseText.innerText = '일시정지';
      startTimer();
      cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(updateGame);
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      if (isPaused) {
        pauseIcon.innerText = '▶️';
        pauseText.innerText = '계속하기';
        showOverlay('게임 일시정지', '경기가 잠시 멈췄습니다. 언제든 계속 플레이할 수 있습니다.', '게임 계속하기');
      } else {
        pauseIcon.innerText = '⏸️';
        pauseText.innerText = '일시정지';
        hideOverlay();
        animationFrameId = requestAnimationFrame(updateGame);
      }
    }

    function handleGameOver(isVictory) {
      isRunning = false;
      stopTimer();
      cancelAnimationFrame(animationFrameId);

      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      const timeStr = `${mins}:${secs}`;

      if (isVictory) {
        showOverlay(
          '🎉 축하합니다! 승리!',
          `모든 블록을 격파했습니다! (기록: ${timeStr})`,
          '다시 도전하기'
        );
      } else {
        showOverlay(
          'GAME OVER',
          `아쉽네요! 남은 블록: ${remainingBricks}개 (${timeStr})`,
          '다시 시작하기'
        );
      }
    }

    function quitGame() {
      isRunning = false;
      isPaused = false;
      stopTimer();
      cancelAnimationFrame(animationFrameId);
      showOverlay('게임 준비 완료', '인천대학교 마스코트 횃불이와 함께 벽돌을 깨보세요!', '게임 시작하기');
      initBricks();
      resetBallAndPaddle();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawPaddle();
      drawBall();
    }

    // Event Listeners: Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Right') {
        paddle.dx = paddle.speed;
      } else if (e.key === 'ArrowLeft' || e.key === 'Left') {
        paddle.dx = -paddle.speed;
      } else if (e.key === ' ' || e.key === 'Spacebar') {
        if (isRunning) togglePause();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'ArrowLeft' || e.key === 'Left') {
        paddle.dx = 0;
      }
    });

    // Mouse / Pointer Movement
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      paddle.x = mouseX - paddle.width / 2;

      // Keep within bounds
      if (paddle.x < 10) paddle.x = 10;
      if (paddle.x + paddle.width > canvas.width - 10) {
        paddle.x = canvas.width - paddle.width - 10;
      }
    });

    // Touch Support for Mobile / Tablets
    canvas.addEventListener('touchmove', (e) => {
      if (!e.touches[0]) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const touchX = (e.touches[0].clientX - rect.left) * scaleX;
      paddle.x = touchX - paddle.width / 2;
      if (paddle.x < 10) paddle.x = 10;
      if (paddle.x + paddle.width > canvas.width - 10) {
        paddle.x = canvas.width - paddle.width - 10;
      }
      e.preventDefault();
    }, { passive: false });

    // Buttons Bindings
    btnPause.addEventListener('click', togglePause);
    btnRestart.addEventListener('click', quitGame);
    overlayStartBtn.addEventListener('click', () => {
      if (isPaused) {
        togglePause();
      } else {
        startGame();
      }
    });

    // Initial Static Render
    initBricks();
    resetBallAndPaddle();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawPaddle();
    drawBall();
  </script>
